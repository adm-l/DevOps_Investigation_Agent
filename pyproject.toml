[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devops-investigation-agent"
version = "1.0.0"
description = "Multi-MCP DevOps investigation agent with mock tools and Ollama"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1.0", "uvicorn[standard]>=0.30,<1.0", "mcp>=1.2,<2.0", "httpx>=0.27,<1.0", "pydantic-settings>=2.5,<3.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "httpx>=0.27", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["app*"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
[tool.ruff]
line-length = 100
target-version = "py312"
